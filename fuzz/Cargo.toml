[package]
name = "cargo-soro-mutants-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Standalone fuzz crate: keep it out of the root workspace so `cargo fuzz`
# and a plain `cargo check` both resolve it independently.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
cargo-soro-mutants = { path = ".." }

[[bin]]
name = "command_construction"
path = "fuzz_targets/command_construction.rs"
test = false
doc = false

[[bin]]
name = "filter_parser"
path = "fuzz_targets/filter_parser.rs"
test = false
doc = false

[[bin]]
name = "parser_discovery"
path = "fuzz_targets/parser_discovery.rs"
test = false
doc = false

[[bin]]
name = "report_serialization"
path = "fuzz_targets/report_serialization.rs"
test = false
doc = false
