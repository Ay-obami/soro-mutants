name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Verify runtime budget monitoring
        run: .github/scripts/check-runtime-budget.sh --self-test
      - name: Test (with runtime budget monitoring)
        run: .github/scripts/check-runtime-budget.sh 480 cargo test --all
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Package
        run: cargo package --locked

  semantic-fixtures:
    name: semantic-fixtures (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: auth
            weak: weak-auth
            strong: strong-auth
            expected: AUTH-001,AUTH-002
          - name: auth-args
            weak: weak-auth-args
            strong: strong-auth-args
            expected: AUTH-003
          - name: auth-helper
            weak: weak-auth-helper
            strong: strong-auth-helper
            expected: AUTH-004
          - name: auth-admin
            weak: weak-auth-admin
            strong: strong-auth-admin
            expected: AUTH-005
          - name: auth-init
            weak: weak-init-auth
            strong: strong-init-auth
            expected: AUTH-006
            function: initialize
          - name: auth-upgrade
            weak: weak-upgrade-auth
            strong: strong-upgrade-auth
            expected: AUTH-007
            function: upgrade
          - name: typed-event
            weak: weak-typed-events
            strong: strong-typed-events
            expected: EVENT-002
          - name: ttl
            weak: weak-ttl-lifecycle
            strong: strong-ttl-lifecycle
            expected: TTL-002,TTL-003
          - name: call-target
            weak: weak-call-target
            strong: strong-call-target
            expected: CALL-001
          - name: event-actor
            weak: weak-event-actor
            strong: strong-event-actor
            expected: EVENT-003
          - name: event-value
            weak: weak-event-value
            strong: strong-event-value
            expected: EVENT-004
          - name: event-topic
            weak: weak-event-topic
            strong: strong-event-topic
            expected: EVENT-005
          - name: token-amount
            weak: weak-token-amount
            strong: strong-token-amount
            expected: TOKEN-003
          - name: token-allowance
            weak: weak-token-allowance
            strong: strong-token-allowance
            expected: TOKEN-002
          - name: token-client
            weak: weak-token-client
            strong: strong-token-client
            expected: TOKEN-004
          - name: call-args
            weak: weak-call-args
            strong: strong-call-args
            expected: CALL-002
          - name: call-return
            weak: weak-call-return
            strong: strong-call-return
            expected: CALL-003
          - name: storage-class
            weak: weak-storage-class
            strong: strong-storage-class
            expected: STORAGE-001
            function: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - name: Build CLI
        run: cargo build --locked
      - name: Verify weak and strong semantic fixtures
        shell: bash
        run: |
          .github/scripts/check-semantic-fixture.sh \
            "${{ matrix.weak }}" \
            "${{ matrix.strong }}" \
            "${{ matrix.expected }}" \
            "${{ matrix.function }}"

  compile-viability:
    name: compile-only mutation fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - name: Build CLI and compile-only test target
        run: cargo test --locked --no-run --test compile_viability_fixtures
      - name: Verify representative mutants reach the compile gate
        run: cargo test --locked --test compile_viability_fixtures -- --ignored --test-threads=1

  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Check locked dependencies for known advisories
        run: cargo audit --file Cargo.lock
