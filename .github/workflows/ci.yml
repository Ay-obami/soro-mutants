name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        run: cargo test --all
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Package
        run: cargo package --locked

  semantic-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
      - name: Build CLI
        run: cargo build --locked
      - name: Weak authorization tests must miss both auth mutants
        shell: bash
        run: |
          set -euo pipefail
          output=$(./target/debug/cargo-soro-mutants test fixtures/weak-auth \
            --target-dir "$GITHUB_WORKSPACE/.ci-fixture-target/weak" \
            --timeout 240 \
            --test-command "cargo test -q --locked")
          printf '%s\n' "$output"
          grep -Eq '^SURVIVED[[:space:]]+AUTH-001' <<<"$output"
          grep -Eq '^SURVIVED[[:space:]]+AUTH-002' <<<"$output"
          ! grep -Eq '^(UNVIABLE|TIMEOUT)' <<<"$output"
      - name: Strong authorization assertion must kill both auth mutants
        shell: bash
        run: |
          set -euo pipefail
          output=$(./target/debug/cargo-soro-mutants test fixtures/strong-auth \
            --target-dir "$GITHUB_WORKSPACE/.ci-fixture-target/strong" \
            --timeout 240 \
            --test-command "cargo test -q --locked")
          printf '%s\n' "$output"
          grep -Eq '^KILLED[[:space:]]+AUTH-001' <<<"$output"
          grep -Eq '^KILLED[[:space:]]+AUTH-002' <<<"$output"
          ! grep -Eq '^(UNVIABLE|TIMEOUT)' <<<"$output"
      - name: Weak authorized-arguments test must miss AUTH-003
