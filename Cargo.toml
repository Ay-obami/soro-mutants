[package]
name = "cargo-soro-mutants"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Soroban-aware semantic mutation testing for Stellar smart contracts"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Ay-obami/soro-mutants"
keywords = ["stellar", "soroban", "mutation-testing", "smart-contracts", "testing"]
categories = ["development-tools::testing"]

[workspace]
members = ["."]
exclude = ["fixtures/weak-auth", "fixtures/strong-auth"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
wait-timeout = "0.2"
